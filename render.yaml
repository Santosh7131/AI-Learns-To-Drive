# Render Blueprint — deploys the playground as a STATIC SITE (no containers).
#
# The deployed site loads the pre-trained policy (frontend/public/web/policy.json)
# and runs the whole simulation in the visitor's browser (WebGPU when available,
# else CPU). No server compute, no GPU bill, free tier is plenty.
#
# One-time before deploying: regenerate + commit the web assets from a trained
# checkpoint (the static build has no Python/GPU):
#     cd backend && python export_web.py      # writes frontend/public/web/*
#     git add frontend/public/web && git commit -m "chore: refresh playground model"
#
# Import this repo on render.com as a Blueprint, or create a Static Site with the
# build command + publish path below. Training runs locally on your GPU (see README).
services:
  - type: web
    name: ai-learns-to-drive
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_PLAYBACK_ONLY
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
