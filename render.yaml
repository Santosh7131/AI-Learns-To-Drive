# Render Blueprint.
#
# The DEPLOYED app is the in-browser playground: a STATIC site that loads the
# pre-trained policy and simulates the cars on each visitor's own machine (no
# server compute, no GPU bill, no cold starts, free tier is plenty).
#
# One-time before deploying: generate + commit the web assets from a trained
# checkpoint (Render's static build has no Python/GPU):
#     cd backend && python export_web.py      # writes frontend/public/web/*
#     git add frontend/public/web && git commit -m "refresh playground model"
#
# Training itself runs locally on your GPU (see README) — it is NOT deployed here.
services:
  - type: web
    name: reinforcement-car-playground
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_PLAYBACK_ONLY
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

